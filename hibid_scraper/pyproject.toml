[project]
name = "hibid-scraper"
version = "0.1.0"
description = "HiBid auction scraper that stores raw JSON payloads in PostgreSQL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "psycopg2-binary>=2.9.9",
    "prefect>=3.4.24",
    # The flow builds silver in-process after each scrape.
    "dbt-postgres>=1.9.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
]
