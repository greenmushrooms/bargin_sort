name: integration-bargin-sort

# The code is baked into the image, so point the worker at the container's
# workdir. Without this, `prefect deploy` writes a set_working_directory step
# using the host path, which does not exist inside the container.
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect

deployments:
  - name: auction-discovery-deployment
    entrypoint: main.py:discover_auctions
    # Timezone is explicit: Prefect cron is UTC by default, which would drift
    # an hour against local auction closing times twice a year.
    #
    # Morning, because this pipeline is answering "what inventory exists", not
    # "what did it sell for". Those want opposite times and only one is
    # obtainable: HiBid zeroes bid data the moment a lot closes, so a late
    # capture buys bid figures that evaporate — while the catalogue itself
    # *shrinks* as an auction closes, because closed lots drop out of the
    # listing. A 43-page catalogue was measured at 11 pages once its close
    # window opened, and the missing lots are unrecoverable.
    #
    # 07:30 is hours ahead of the afternoon and evening closes, so auctions are
    # captured whole.
    schedules:
      - cron: "30 7 * * *"
        timezone: "America/Toronto"
    parameters:
      zip_code: "m8w3b7"
      # Full 50 miles for the aggregation phase — cast wide, then decide from
      # the data what is worth targeting. auction_schedule's radius_km var
      # (80.5) applies the matching exact cutoff.
      radius_miles: 50
      horizon_days: 14
      test_mode: false
      build_downstream: true
    work_pool:
      name: dev-pool-docker
      job_variables:
        image: integration-bargin-sort:latest
        networks:
          - project-hub-network
        env:
          PREFECT_LOGGING_EXTRA_LOGGERS: "scraper,auction_discovery,apollo,database,transform,main,maintenance"
          FLARESOLVERR_URL: "http://flaresolverr:8191/v1"
          # HiBid never sees this container's IP — prefer_direct is False, so
          # every HiBid request is made by FlareSolverr's Chrome. Proxying the
          # scraper would change nothing; the proxy has to be handed to
          # FlareSolverr, which is what this does. Empty disables it, leaving
          # FlareSolverr unproxied for the other projects that share it.
          FLARESOLVERR_PROXY: "http://gluetun-scraper:8888"
          DB_HOST: "{{ prefect.blocks.secret.bargin-sort--database-host }}"
          DB_PORT: "{{ prefect.blocks.secret.bargin-sort--database-port }}"
          DB_USER: "{{ prefect.blocks.secret.bargin-sort--database-user }}"
          DB_PASSWORD: "{{ prefect.blocks.secret.bargin-sort--database-password }}"
          DB_NAME: "{{ prefect.blocks.secret.bargin-sort--database-name }}"

  - name: closing-auctions-deployment
    entrypoint: main.py:scrape_closing_auctions
    # 30 minutes behind discovery, whose auction_schedule this reads. Morning
    # for the same reason: a catalogue read before its close window is complete,
    # one read during it is missing whatever has already closed.
    schedules:
      - cron: "0 8 * * *"
        timezone: "America/Toronto"
    parameters:
      # Not a search parameter here — the catalogue is already the scope — but
      # the origin every lot's distance is measured from.
      zip_code: "m8w3b7"
      # Two days, not one, so every auction falls inside two consecutive
      # windows and is captured on the first. Daily windows tile exactly, which
      # sounds sufficient until a run is missed and takes a whole day's
      # auctions with it. The cost of the overlap is capturing ~a day earlier,
      # and dedup means it is still scraped exactly once.
      days_ahead: 2
      # 80.5 km = 50 miles, matching discovery. lots_within_50km keeps the
      # tighter screen for "what is worth driving to".
      max_km: 80.5
      test_mode: false
      build_downstream: true
    work_pool:
      name: dev-pool-docker
      job_variables:
        image: integration-bargin-sort:latest
        networks:
          - project-hub-network
        env:
          PREFECT_LOGGING_EXTRA_LOGGERS: "scraper,auction_discovery,apollo,database,transform,main,maintenance"
          FLARESOLVERR_URL: "http://flaresolverr:8191/v1"
          FLARESOLVERR_PROXY: "http://gluetun-scraper:8888"
          DB_HOST: "{{ prefect.blocks.secret.bargin-sort--database-host }}"
          DB_PORT: "{{ prefect.blocks.secret.bargin-sort--database-port }}"
          DB_USER: "{{ prefect.blocks.secret.bargin-sort--database-user }}"
          DB_PASSWORD: "{{ prefect.blocks.secret.bargin-sort--database-password }}"
          DB_NAME: "{{ prefect.blocks.secret.bargin-sort--database-name }}"

  - name: bargin-sort-deployment
    entrypoint: main.py:scrape_auctions
    # Deliberately unscheduled. The radius sweep re-read every auction on every
    # one of the ~4 days it stayed open, and still could not see an auction
    # whole — an open-status search drops lots as they close, so auctions
    # mid-close came back partial and several large local ones never appeared at
    # all. discover_auctions + scrape_closing_auctions replace it on the
    # schedule; this stays deployable for ad-hoc searches.
    schedules: []
    parameters:
      zip_code: "m8w3b7"
      radius_miles: 31
      test_mode: false
      build_downstream: true
    work_pool:
      name: dev-pool-docker
      job_variables:
        # Without this the pool falls back to its default, which is another
        # project's image entirely.
        image: integration-bargin-sort:latest
        networks:
          - project-hub-network
        env:
          # Route the scraper's own loggers into Prefect's run logs; without
          # this they go to container stdout and a failed run is undiagnosable.
          PREFECT_LOGGING_EXTRA_LOGGERS: "scraper,database,transform,main,maintenance"
          # Cloudflare fallback. Requires flaresolverr on project-hub-network:
          #   docker network connect project-hub-network flaresolverr
          FLARESOLVERR_URL: "http://flaresolverr:8191/v1"
          DB_HOST: "{{ prefect.blocks.secret.bargin-sort--database-host }}"
          DB_PORT: "{{ prefect.blocks.secret.bargin-sort--database-port }}"
          DB_USER: "{{ prefect.blocks.secret.bargin-sort--database-user }}"
          DB_PASSWORD: "{{ prefect.blocks.secret.bargin-sort--database-password }}"
          DB_NAME: "{{ prefect.blocks.secret.bargin-sort--database-name }}"

  - name: police-auctions-deployment
    entrypoint: main.py:scrape_police_auctions
    # 05:30, ahead of the HiBid pair at 07:30/08:00. Overlapping them would put
    # both through one FlareSolverr and have two dbt runs racing for the same
    # silver tables.
    schedules:
      - cron: "30 5 * * *"
        timezone: "America/Toronto"
    parameters:
      test_mode: false
      build_downstream: true
    work_pool:
      name: dev-pool-docker
      job_variables:
        # Without this the pool falls back to its default, which is another
        # project's image entirely.
        image: integration-bargin-sort:latest
        networks:
          - project-hub-network
        env:
          # Route the scraper's own loggers into Prefect's run logs; without
          # this they go to container stdout and a failed run is undiagnosable.
          PREFECT_LOGGING_EXTRA_LOGGERS: "scraper,database,transform,main,maintenance"
          # Cloudflare fallback. Requires flaresolverr on project-hub-network:
          #   docker network connect project-hub-network flaresolverr
          FLARESOLVERR_URL: "http://flaresolverr:8191/v1"
          DB_HOST: "{{ prefect.blocks.secret.bargin-sort--database-host }}"
          DB_PORT: "{{ prefect.blocks.secret.bargin-sort--database-port }}"
          DB_USER: "{{ prefect.blocks.secret.bargin-sort--database-user }}"
          DB_PASSWORD: "{{ prefect.blocks.secret.bargin-sort--database-password }}"
          DB_NAME: "{{ prefect.blocks.secret.bargin-sort--database-name }}"

  - name: wishlist-notify-deployment
    entrypoint: notify.py:notify_wishlist
    # 09:30, behind all three scrapes and their dbt builds — police at 05:30,
    # discovery at 07:30, closing catalogues at 08:00. Reading silver before
    # the last of those lands would announce yesterday's picture and, worse,
    # mark today's lots as already-told.
    #
    # Still hours ahead of the afternoon and evening closes, which is the
    # constraint that matters: an alert is only worth sending while there is
    # time to bid on what it names.
    #
    # One deployment, not a step inside each scrape: each scrape sees only its
    # own slice, so a notifier bolted onto them would fire three times a
    # morning and split one list across three messages.
    schedules:
      - cron: "30 9 * * *"
        timezone: "America/Toronto"
    parameters:
      # Set true to have a run format and log the message without sending or
      # recording it — how a new wishlist row gets checked before it is trusted.
      dry_run: false
    work_pool:
      name: dev-pool-docker
      job_variables:
        image: integration-bargin-sort:latest
        networks:
          - project-hub-network
        env:
          PREFECT_LOGGING_EXTRA_LOGGERS: "database,notify"
          DB_HOST: "{{ prefect.blocks.secret.bargin-sort--database-host }}"
          DB_PORT: "{{ prefect.blocks.secret.bargin-sort--database-port }}"
          DB_USER: "{{ prefect.blocks.secret.bargin-sort--database-user }}"
          DB_PASSWORD: "{{ prefect.blocks.secret.bargin-sort--database-password }}"
          DB_NAME: "{{ prefect.blocks.secret.bargin-sort--database-name }}"
          # This project's own bot, deliberately not job_searcher's. The two
          # feeds have different urgency — a job posting keeps for a week, a lot
          # closes this evening — and sharing a chat means muting one mutes the
          # other. Both blocks must exist before `prefect deploy`, or the
          # template resolves to nothing and the flow skips every morning.
          TELEGRAM_BOT_TOKEN: "{{ prefect.blocks.secret.bargin-sort--telegram-bot-token }}"
          TELEGRAM_CHAT_ID: "{{ prefect.blocks.secret.bargin-sort--telegram-chat-id }}"

  - name: raw-retention
    entrypoint: maintenance.py:raw_retention
    # Daily rather than monthly. Dropping is a no-op on all but the first day
    # of a month, and running it every day means a month ageing out is removed
    # promptly instead of sitting around until the next monthly tick. Runs
    # before the scrapes so it never competes with a write-heavy load.
    schedules:
      - cron: "30 3 * * *"
        timezone: "America/Toronto"
    parameters:
      months: 6
      dry_run: false
    work_pool:
      name: dev-pool-docker
      job_variables:
        # Without this the pool falls back to its default, which is another
        # project's image entirely.
        image: integration-bargin-sort:latest
        networks:
          - project-hub-network
        env:
          DB_HOST: "{{ prefect.blocks.secret.bargin-sort--database-host }}"
          DB_PORT: "{{ prefect.blocks.secret.bargin-sort--database-port }}"
          DB_USER: "{{ prefect.blocks.secret.bargin-sort--database-user }}"
          DB_PASSWORD: "{{ prefect.blocks.secret.bargin-sort--database-password }}"
          DB_NAME: "{{ prefect.blocks.secret.bargin-sort--database-name }}"
          PREFECT_LOGGING_EXTRA_LOGGERS: "scraper,database,transform,main,maintenance"

  - name: flaresolverr-reap
    entrypoint: maintenance.py:flaresolverr_reap
    # Unscheduled on purpose. The fetcher no longer strands sessions, so this
    # is a recovery lever rather than routine upkeep — reach for it after a
    # FlareSolverr wobble, when Chrome starts refusing to launch. It refuses to
    # run while a scrape of the same source is in flight, so it is safe to fire
    # at any time; it will simply decline and say so.
    schedules: []
    parameters:
      source: hibid
      dry_run: false
    work_pool:
      name: dev-pool-docker
      job_variables:
        image: integration-bargin-sort:latest
        networks:
          - project-hub-network
        env:
          DB_HOST: "{{ prefect.blocks.secret.bargin-sort--database-host }}"
          DB_PORT: "{{ prefect.blocks.secret.bargin-sort--database-port }}"
          DB_USER: "{{ prefect.blocks.secret.bargin-sort--database-user }}"
          DB_PASSWORD: "{{ prefect.blocks.secret.bargin-sort--database-password }}"
          DB_NAME: "{{ prefect.blocks.secret.bargin-sort--database-name }}"
          FLARESOLVERR_URL: "http://flaresolverr:8191/v1"
          PREFECT_LOGGING_EXTRA_LOGGERS: "scraper,database,transform,main,maintenance"
