data__bargin_sort:
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DB_HOST') }}"
      port: "{{ env_var('DB_PORT') | int }}"
      dbname: "{{ env_var('DB_NAME') }}"
      user: "{{ env_var('DB_USER') }}"
      pass: "{{ env_var('DB_PASSWORD') }}"
      # Layer schemas come from the +schema configs in dbt_project.yml, which
      # dbt appends to this one. Keeping it as the bare project name would give
      # bargin_sort_silver etc, so the generate_schema_name macro overrides it.
      schema: public
      threads: 4
  target: dev
