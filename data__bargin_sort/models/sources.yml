version: 2

sources:
  - name: raw
    schema: raw
    description: >
      Append-only landing zone, one table per source. Each table is partitioned
      by month on scraped_at; partitions past the retention window are dropped
      wholesale, so silver must tolerate history disappearing from underneath it.
    tables:
      - name: hibid
        description: One row per lot per scrape of hibid.com. Never updated.
        columns:
          - name: item_id
            description: HiBid lot id. Not unique — one row per observation.
            tests: [not_null]
          - name: raw_json
            description: Complete Apollo `Lot` object, with the resolved auction inlined.
            tests: [not_null]
          - name: scraped_at
            description: Partition key.
            tests: [not_null]
          - name: sys_run_name
            description: Prefect flow run name; the incremental watermark.
            tests: [not_null]

      - name: hibid_auctions
        description: >
          One row per auction per discovery pass of hibid.com/auctions. The
          orchestrator's work queue: it carries close times and lot counts for
          auctions whose lots have not been scraped yet, which is what lets each
          auction be visited exactly once, shortly before it closes.
        columns:
          - name: item_id
            description: HiBid auction id. Not unique — one row per observation.
            tests: [not_null]
          - name: raw_json
            description: Complete Apollo `Auction` object as the discovery feed returned it.
            tests: [not_null]
          - name: scraped_at
            description: Partition key.
            tests: [not_null]
          - name: sys_run_name
            tests: [not_null]

      - name: police_auctions
        description: One row per listing per scrape of policeauctionscanada.com.
        columns:
          - name: item_id
            description: Their listing id. Not unique — one row per observation.
            tests: [not_null]
          - name: raw_json
            description: Fields parsed from the listing card, plus the fixed warehouse location.
            tests: [not_null]
          - name: scraped_at
            description: Partition key.
            tests: [not_null]
          - name: sys_run_name
            tests: [not_null]

      - name: catalog_pages
        description: >
          Which pages of each auction's catalogue have been banked. The
          complement of pages_done, up to expected_pages, is the work queue for
          the next pass — so a failed page is outstanding work rather than
          something that halts the scan.
        columns:
          - name: auction_id
            tests: [not_null, unique]
          - name: pages_done
            tests: [not_null]
          - name: expected_pages
            description: ceil(lot_count / 100), as discovery last reported it.
            tests: [not_null]

      - name: catalog_progress
        description: >
          Where each auction's catalogue pagination reached, so a partial pass
          resumes instead of re-reading the front. Scheduler state: one mutable
          row per auction, never a source of truth about lots.
        columns:
          - name: auction_id
            tests: [not_null, unique]
          - name: last_page
            description: Highest page that yielded lots; 0 means start over.
            tests: [not_null]

      - name: scrape_runs
        description: >
          Run bookkeeping across every source, including the per-run scrape
          parameters that are deliberately not repeated on each item row.
        columns:
          - name: sys_run_name
            tests: [not_null]
          - name: source
            tests: [not_null]
