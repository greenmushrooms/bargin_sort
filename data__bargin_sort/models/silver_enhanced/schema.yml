version: 2

models:
  - name: fct_lots
    description: >
      Current state of every lot, one row per item_id, with a great-circle
      distance from the search origin.
    columns:
      - name: item_id
        description: The grain. One row per lot, latest observation wins.
        tests: [not_null, unique]

      - name: lot_url
        description: Link to the live lot, where the real current price is.
        tests: [not_null]

      - name: distance_km
        description: >
          Never null. Lots that cannot be placed are excluded upstream rather
          than carried with an unknown distance, because a null here would
          silently drop out of every radius filter.
        tests: [not_null]

      - name: auction_id
        description: >
          Null for sources with no auction grouping — Police Auctions is a
          single seller. The HiBid guarantee is kept by
          assert_hibid_lots_have_auction instead.
        tests:
          - relationships:
              to: ref('stg_auctions')
              field: auction_id

  - name: lots_within_50km
    description: The 50 km catalogue — the question the pipeline exists to answer.
    columns:
      - name: item_id
        tests: [not_null, unique]
      - name: distance_km
        tests: [not_null]

  - name: auction_schedule
    description: >
      Every discovered auction with a real distance and an absolute close time.
      The orchestrator's selection query reads this: in-radius auctions closing
      soon that have no completed scrape run yet.
    columns:
      - name: auction_id
        tests: [not_null, unique]

      - name: close_at
        description: >
          bid_close_local resolved to an instant as America/Toronto. Only
          meaningful for rows where is_within_radius is true — see the model's
          note on widening the radius.
        tests: [not_null]

      - name: is_within_radius
        description: >
          False for auctions outside the cutoff and for auctions whose postal
          code did not geocode. Never null, so the orchestrator's filter can
          never silently admit an unplaceable auction.
        tests: [not_null]

  - name: auction_manifest
    description: >
      The scrape ledger: every discovered auction and whether it has been
      taken. The single written form of the rule that an auction is scraped
      once — the orchestrator selects `scrape_state in ('pending','retry')`
      rather than restating the condition, so the board and the scheduler
      cannot disagree. A view, because state changes during a run.
    columns:
      - name: auction_id
        tests: [not_null, unique]

      - name: scrape_state
        description: >
          pending — in radius, still open, never attempted.
          retry — attempted and still short, with a resume point to continue from.
          captured — enough distinct lots held, however many passes it took.
          missed — closed before it was ever captured. The number to watch.
          out_of_radius — outside the cutoff or not geocodable; never scraped.
        tests:
          - not_null
          - accepted_values:
              values: ['pending', 'retry', 'captured', 'missed', 'out_of_radius']

      - name: lots_held
        description: >
          Distinct lots of this auction in raw, across every pass. This is what
          decides capture — not whether any single run got it all.
        tests: [not_null]

      - name: coverage_pct
        description: lots_held as a percentage of the auction's advertised lot_count.

      - name: resume_page
        description: >
          Page the next pass continues from, via raw.catalog_progress. Null
          means never attempted; 0 means the last pass ran off the end and the
          next should sweep from the front again.
