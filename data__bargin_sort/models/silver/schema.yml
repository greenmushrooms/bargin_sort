version: 2

models:
  - name: stg_hibid_lots
    description: >
      One row per lot per completed scrape run, restricted to lots HiBid
      actually returned as search results.
    columns:
      - name: item_id
        description: HiBid lot id. Unique within a run, repeated across runs.
        tests: [not_null]

      - name: lot_id
        tests: [not_null]

      - name: sys_run_name
        tests: [not_null]

      - name: auction_id
        description: >
          Never null by construction — the model drops lots with no resolvable
          auction, since those are featured items from other auctions that can
          never be placed in a radius. This test is what keeps that guarantee.
        tests: [not_null]

      - name: title
        tests: [not_null]

      - name: lot_status
        description: Status from lotState. Warns rather than fails, so a new HiBid status surfaces without stopping the pipeline.
        tests:
          - accepted_values:
              severity: warn
              values:
                - OPEN
                - CLOSED
                - CLOSED_SHOW_STATUS
                - POSTED
                - POSTED_NO_INTERNET_BIDDING
                - SOLD

  - name: stg_auctions
    description: One row per auction, collapsed to its most recent observation.
    columns:
      - name: auction_id
        tests: [not_null, unique]

      - name: event_country_code
        description: Derived from the postal code's shape; the seed only covers CA and US.
        tests:
          - accepted_values:
              severity: warn
              values: ['CA', 'US']

  - name: stg_hibid_auctions
    description: >
      One row per auction from the discovery feed, collapsed to its most recent
      observation. Knows about auctions before any of their lots exist, which is
      what the orchestrator schedules against.
    columns:
      - name: auction_id
        tests: [not_null, unique]

      - name: event_name
        tests: [not_null]

      - name: bid_close_local
        description: >
          Naive local time as HiBid states it. Resolved to an instant in
          silver_enhanced, where the geocode says which timezone applies.
        tests: [not_null]

      - name: event_country_code
        description: Derived from the postal code's shape; the seed only covers CA and US.
        tests:
          - accepted_values:
              severity: warn
              values: ['CA', 'US']

      - name: auction_status
        description: >
          Where the auction is in its lifecycle. POSTED and NO_CATALOG_YET are
          not yet taking bids, so their lot counts are projections rather than
          inventory. Warns rather than fails, so a new HiBid status surfaces
          without stopping the pipeline.
        tests:
          - accepted_values:
              severity: warn
              values:
                - OPEN_ABSENTEE
                - OPEN_LIVE_CATALOG
                - POSTED
                - NO_CATALOG_YET
                - CLOSED

  - name: stg_police_lots
    description: >
      One row per listing per completed scrape of Police Auctions Canada. A
      single warehouse, so location is a constant rather than a per-listing
      field.
    columns:
      - name: item_id
        tests: [not_null]
      - name: lot_id
        tests: [not_null]
      - name: sys_run_name
        tests: [not_null]
      - name: title
        tests: [not_null]
      - name: lot_url
        tests: [not_null]
      - name: event_postal_key
        description: Their warehouse FSA, taken from the site's own contact page.
        tests: [not_null]
      - name: lot_status
        tests:
          - accepted_values:
              severity: warn
              values: ['OPEN', 'CLOSED']
